    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own

    // contexts such as a sandboxed preview iframe) — location.origin is

      // and sender identity (own child frame / direct parent) is checked

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.

    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;

    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach

    const resourceMap = {};

    // consumers read these Blobs directly. Survives the swap like the error sink.

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <\u002Fsc-raw-select>\n          <sc-if value=\"{{ anyFilter }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ clearAll }}\" style=\"padding:7px 12px; border:1px solid #E4C9C0; background:#FFFFFF; color:#C24A1E; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer\" style-hover=\"background:#FDF3EF\">Clear all<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:baseline; gap:8px; margin-bottom:16px\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; color:#1A4D1C\">{{ resultCount }}<\u002Fdiv>\n      <div style=\"font-size:13px; color:#7C8A84\">{{ resultLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ hasResults }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px\">\n      <sc-for list=\"{{ results }}\" as=\"item\" hint-placeholder-count=\"6\">\n        <article sc-camel-on-click=\"{{ item.open }}\" style=\"display:flex; flex-direction:column; cursor:pointer; background:{{ item.wash }}; border:1px solid {{ item.edge }}; border-top:4px solid {{ item.accent }}; border-radius:12px; padding:18px; gap:13px; box-shadow:0 1px 2px rgba(16,24,20,.04)\" style-hover=\"box-shadow:0 10px 30px -18px rgba(16,24,20,.45); transform:translateY(-2px)\">\n          <div style=\"display:flex; align-items:center; gap:10px\">\n            <div style=\"width:38px; height:38px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#FFFFFF; background:{{ item.accent }}\">{{ item.initials }}<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:1px; min-width:0\">\n              <div style=\"font-size:13.5px; font-weight:700; color:#1A1A1A; line-height:1.25\">{{ item.authorName }}<\u002Fdiv>\n              <div style=\"font-size:11.5px; color:#7C8A84; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap\">{{ item.authorBrand }} · {{ item.credential }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-left:auto; display:flex; gap:6px; flex:0 0 auto\">\n              <sc-if value=\"{{ item.isNew }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:#FCCB20; color:#4A3B00; padding:3px 7px; border-radius:5px\">New<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ item.focus_match }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:inline-flex; align-self:flex-start; align-items:center; gap:5px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7A5C00; background:#FFF3CC; border:1px solid #FCCB20; padding:4px 9px; border-radius:6px\">⚡ Top Pick<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex; align-items:center; gap:8px; font-size:11px; color:#7C8A84\">\n            <span style=\"background:#F1F5F3; border:1px solid #E4E9E6; padding:3px 8px; border-radius:5px; font-weight:500; color:#5C6B65\">{{ item.category }}<\u002Fspan>\n            <span>{{ item.dateLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:0; font-size:18px; line-height:1.25; letter-spacing:-.4px; font-weight:700; color:#1A1A1A; text-wrap:pretty\">{{ item.title }}<\u002Fh3>\n          <p style=\"margin:0; font-size:13.5px; line-height:1.55; color:#4A5852; max-height:6.3em; overflow:hidden; text-wrap:pretty\">{{ item.summary }}<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:4px\">\n            <sc-if value=\"{{ item.hasArticle }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ item.article_url }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#009E6D; color:#FFFFFF; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"background:#00875D; color:#FFFFFF; text-decoration:none\">Read the full post<\u002Fa>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ item.hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n              <a href=\"{{ item.youtube_url }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:{{ item.watchBg }}; color:{{ item.watchFg }}; border:1px solid {{ item.watchEdge }}; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"text-decoration:none\">▶ Watch<\u002Fa>\n            <\u002Fsc-if>\n            <a href=\"{{ item.claudeUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#005999; border:1px solid #CFDCE6; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"border-color:#005999; color:#005999; text-decoration:none\">✦ Ask Claude<\u002Fa>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"padding:64px 24px; text-align:center; border:1px dashed #DFE5E2; border-radius:14px; background:#F6F8F7\">\n        <div style=\"font-size:30px; margin-bottom:10px\">⌕<\u002Fdiv>\n        <div style=\"font-size:17px; font-weight:700; margin-bottom:6px\">Nothing in the Codex matches that — yet.<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#5C6B65; margin-bottom:18px\">Try a broader term, or drop a filter or two.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ clearAll }}\" style=\"padding:10px 18px; border:0; background:#009E6D; color:#FFFFFF; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer\">Clear all filters<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ AUTHORS INDEX ═══════════ -->\n  <sc-if value=\"{{ isAuthors }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1; max-width:1240px; width:100%; margin:0 auto; padding:36px 24px 80px\">\n    <h1 style=\"margin:0 0 8px; font-size:30px; letter-spacing:-.9px; font-weight:700\">The educators<\u002Fh1>\n    <p style=\"margin:0 0 28px; font-size:14.5px; color:#5C6B65; max-width:620px; line-height:1.6\">Every technique in the Codex was created and taught by one of these people. PMX organizes and points; the work is theirs.<\u002Fp>\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px\">\n      <sc-for list=\"{{ authorCards }}\" as=\"a\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ a.open }}\" style=\"cursor:pointer; border:1px solid #E4E9E6; border-top:4px solid {{ a.accent }}; border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:14px; background:#FFFFFF\" style-hover=\"box-shadow:0 10px 30px -18px rgba(16,24,20,.45); transform:translateY(-2px)\">\n          <div style=\"display:flex; align-items:center; gap:13px\">\n            <div style=\"width:52px; height:52px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:700; color:#FFFFFF; background:{{ a.accent }}\">{{ a.initials }}<\u002Fdiv>\n            <div style=\"min-width:0\">\n              <div style=\"font-size:17px; font-weight:700; letter-spacing:-.3px\">{{ a.name }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#7C8A84\">{{ a.brand }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:{{ a.accent }}\">{{ a.credential }}<\u002Fdiv>\n          <div style=\"display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid #F1F5F3\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#5C6B65\">{{ a.countLabel }}<\u002Fspan>\n            <span style=\"font-size:12.5px; font-weight:600; color:#009E6D\">View tips →<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ AUTHOR VIEW ═══════════ -->\n  <sc-if value=\"{{ isAuthor }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1; width:100%; margin:0 auto; padding:0 0 80px\">\n    <div style=\"background:#F6F8F7; border-bottom:1px solid #E4E9E6\">\n      <div style=\"max-width:1240px; margin:0 auto; padding:34px 24px 30px\">\n        <button sc-camel-on-click=\"{{ goAuthors }}\" style=\"margin-bottom:20px; padding:0; border:0; background:transparent; font-size:12.5px; font-weight:600; color:#7C8A84; cursor:pointer\">← All educators<\u002Fbutton>\n        <div style=\"display:flex; gap:22px; align-items:flex-start; flex-wrap:wrap\">\n          <div style=\"width:88px; height:88px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:29px; font-weight:700; color:#FFFFFF; background:{{ authorAccent }}\">{{ authorInitials }}<\u002Fdiv>\n          <div style=\"flex:1; min-width:280px\">\n            <h1 style=\"margin:0 0 4px; font-size:32px; letter-spacing:-.9px; font-weight:700\">{{ authorName }}<\u002Fh1>\n            <div style=\"font-size:15px; color:#5C6B65; margin-bottom:10px\">{{ authorBrand }} · {{ authorCredential }}<\u002Fdiv>\n            <div style=\"height:3px; width:72px; margin-bottom:14px; background:{{ authorAccent }}\"><\u002Fdiv>\n            <p style=\"margin:0 0 16px; font-size:14px; line-height:1.6; color:#4A5852; max-width:640px; text-wrap:pretty\">{{ authorCredit }}<\u002Fp>\n            <div style=\"display:flex; gap:10px; flex-wrap:wrap; align-items:center\">\n              <sc-if value=\"{{ authorHasSite }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ authorSite }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:9px 15px; border-radius:8px; background:#FFFFFF; border:1px solid #DFE5E2; font-size:13px; font-weight:600; color:#1A1A1A; text-decoration:none\" style-hover=\"border-color:#009E6D; color:#1A1A1A; text-decoration:none\">Visit {{ authorBrand }} ↗<\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ authorHasYt }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ authorYoutube }}\" target=\"_blank\" rel=\"noopener\" style=\"padding:9px 15px; border-radius:8px; background:#FFFFFF; border:1px solid #DFE5E2; font-size:13px; font-weight:600; color:#1A1A1A; text-decoration:none\" style-hover=\"border-color:#009E6D; color:#1A1A1A; text-decoration:none\">▶ YouTube channel ↗<\u002Fa>\n              <\u002Fsc-if>\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:13px; color:#5C6B65; margin-left:4px\">{{ authorCountLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"max-width:1240px; margin:0 auto; padding:30px 24px 0\">\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px\">\n        <sc-for list=\"{{ results }}\" as=\"item\" hint-placeholder-count=\"6\">\n          <article sc-camel-on-click=\"{{ item.open }}\" style=\"display:flex; flex-direction:column; cursor:pointer; background:{{ item.wash }}; border:1px solid {{ item.edge }}; border-top:4px solid {{ item.accent }}; border-radius:12px; padding:18px; gap:13px; box-shadow:0 1px 2px rgba(16,24,20,.04)\" style-hover=\"box-shadow:0 10px 30px -18px rgba(16,24,20,.45); transform:translateY(-2px)\">\n            <div style=\"display:flex; align-items:center; gap:8px; font-size:11px; color:#7C8A84\">\n              <span style=\"background:#F1F5F3; border:1px solid #E4E9E6; padding:3px 8px; border-radius:5px; font-weight:500; color:#5C6B65\">{{ item.category }}<\u002Fspan>\n              <span>{{ item.dateLabel }}<\u002Fspan>\n              <sc-if value=\"{{ item.focus_match }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#7A5C00; background:#FFF3CC; border:1px solid #FCCB20; padding:3px 8px; border-radius:5px\">⚡ Top Pick<\u002Fspan><\u002Fsc-if>\n            <\u002Fdiv>\n            <h3 style=\"margin:0; font-size:18px; line-height:1.25; letter-spacing:-.4px; font-weight:700; color:#1A1A1A; text-wrap:pretty\">{{ item.title }}<\u002Fh3>\n            <p style=\"margin:0; font-size:13.5px; line-height:1.55; color:#4A5852; max-height:6.3em; overflow:hidden; text-wrap:pretty\">{{ item.summary }}<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:4px\">\n              <sc-if value=\"{{ item.hasArticle }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ item.article_url }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#009E6D; color:#FFFFFF; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"background:#00875D; color:#FFFFFF; text-decoration:none\">Read the full post<\u002Fa>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ item.hasVideo }}\" hint-placeholder-val=\"{{ false }}\">\n                <a href=\"{{ item.youtube_url }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:{{ item.watchBg }}; color:{{ item.watchFg }}; border:1px solid {{ item.watchEdge }}; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"text-decoration:none\">▶ Watch<\u002Fa>\n              <\u002Fsc-if>\n              <a href=\"{{ item.claudeUrl }}\" target=\"_blank\" rel=\"noopener\" sc-camel-on-click=\"{{ stop }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#FFFFFF; color:#005999; border:1px solid #CFDCE6; padding:8px 13px; border-radius:7px; font-size:12.5px; font-weight:600; text-decoration:none\" style-hover=\"border-color:#005999; color:#005999; text-decoration:none\">✦ Ask Claude<\u002Fa>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ authorNoResults }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:56px 24px; text-align:center; border:1px dashed #DFE5E2; border-radius:14px; background:#F6F8F7\">\n          <div style=\"font-size:16px; font-weight:700; margin-bottom:6px\">No tips from {{ authorName }} match “{{ query }}”.<\u002Fdiv>\n          <div style=\"font-size:13.5px; color:#5C6B65; margin-bottom:18px\">Clear the search to see everything they've contributed.<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ authorClearSearch }}\" style=\"padding:10px 18px; border:0; background:#009E6D; color:#FFFFFF; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer\">Clear search<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ ADMIN ═══════════ -->\n  <sc-if value=\"{{ isLocked }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1; display:flex; align-items:center; justify-content:center; padding:80px 24px\">\n    <div style=\"width:100%; max-width:420px; border:1px solid #E4E9E6; border-radius:14px; padding:30px; display:flex; flex-direction:column; gap:16px; box-shadow:0 20px 50px -34px rgba(16,24,20,.6)\">\n      <div style=\"width:40px; height:40px; border-radius:10px; background:#1A4D1C; color:#FCCB20; display:flex; align-items:center; justify-content:center; font-size:18px\">⚿<\u002Fdiv>\n      <div>\n        <h1 style=\"margin:0 0 6px; font-size:22px; letter-spacing:-.5px; font-weight:700\">Codex admin<\u002Fh1>\n        <p style=\"margin:0; font-size:13.5px; line-height:1.6; color:#5C6B65\">Enter your workflow key. It's held in this browser only and sent with every request to n8n — n8n is what actually accepts or rejects it.<\u002Fp>\n      <\u002Fdiv>\n      <input type=\"password\" value=\"{{ keyInput }}\" sc-camel-on-change=\"{{ onKeyInput }}\" sc-camel-on-key-down=\"{{ onKeyEnter }}\" placeholder=\"Workflow key\" style=\"width:100%; padding:11px 13px; border:1px solid #DFE5E2; border-radius:9px; font-size:14px; outline:none; font-family:'IBM Plex Mono',monospace\" style-focus=\"border-color:#009E6D\">\n      <button sc-camel-on-click=\"{{ unlock }}\" style=\"padding:12px; border:0; border-radius:9px; background:#009E6D; color:#FFFFFF; font-size:14px; font-weight:600; cursor:pointer\" style-hover=\"background:#00875D\">Unlock<\u002Fbutton>\n      <div style=\"font-size:11.5px; line-height:1.6; color:#9AA5A0; padding-top:12px; border-top:1px solid #F1F5F3\">This gate hides the controls, it does not hide the data — everything in the Codex is public by design. Real protection lives in the n8n webhook.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n  <main style=\"flex:1; max-width:1240px; width:100%; margin:0 auto; padding:36px 24px 80px\">\n    <div style=\"display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px\">\n      <div>\n        <h1 style=\"margin:0 0 4px; font-size:30px; letter-spacing:-.9px; font-weight:700\">Codex admin<\u002Fh1>\n        <div style=\"font-size:14px; color:#3A4842\">Submit links and curate the educator records without touching JSON.<\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ lock }}\" style=\"padding:9px 15px; border:1px solid #DFE5E2; background:#FFFFFF; border-radius:8px; font-size:13px; font-weight:600; color:#5C6B65; cursor:pointer\" style-hover=\"border-color:#C24A1E; color:#C24A1E\">Lock admin<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; gap:6px; margin-bottom:24px; border-bottom:1px solid #E4E9E6\">\n      <button sc-camel-on-click=\"{{ tabSubmit }}\" style=\"padding:11px 16px; border:0; background:transparent; font-size:13.5px; font-weight:600; cursor:pointer; color:{{ tabSubmitFg }}; border-bottom:2.5px solid {{ tabSubmitEdge }}\">Submit a tip<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ tabAuthors }}\" style=\"padding:11px 16px; border:0; background:transparent; font-size:13.5px; font-weight:600; cursor:pointer; color:{{ tabAuthorsFg }}; border-bottom:2.5px solid {{ tabAuthorsEdge }}\">Educators<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ tabSettings }}\" style=\"padding:11px 16px; border:0; background:transparent; font-size:13.5px; font-weight:600; cursor:pointer; color:{{ tabSettingsFg }}; border-bottom:2.5px solid {{ tabSettingsEdge }}\">Settings<\u002Fbutton>\n    <\u002Fdiv>\n\n    <!-- SUBMIT TAB -->\n    <sc-if value=\"{{ onTabSubmit }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:560px; display:flex; flex-direction:column; gap:14px\">\n        <div style=\"font-size:14px; line-height:1.6; color:#3A4842\">Paste a link to an Excel article or video. Claude reads it, writes the summary, detects the author, and appends it to <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12.5px; background:#F1F5F3; padding:1px 5px; border-radius:4px\">tips.json<\u002Fspan>.<\u002Fdiv>\n        <input type=\"url\" value=\"{{ submitUrl }}\" sc-camel-on-change=\"{{ onSubmitUrl }}\" placeholder=\"https://…\" style=\"width:100%; padding:11px 13px; border:1px solid #DFE5E2; border-radius:9px; font-size:14px; outline:none\" style-focus=\"border-color:#009E6D\">\n        <textarea value=\"{{ submitNote }}\" sc-camel-on-change=\"{{ onSubmitNote }}\" rows=\"3\" placeholder=\"Optional — why it's worth filing (helps Claude categorize)\" style=\"width:100%; padding:11px 13px; border:1px solid #DFE5E2; border-radius:9px; font-size:13.5px; resize:vertical; outline:none; font-family:inherit\" style-focus=\"border-color:#009E6D\"><\u002Ftextarea>\n        <div style=\"display:flex; gap:10px; align-items:center\">\n          <button sc-camel-on-click=\"{{ doSubmit }}\" disabled=\"{{ submitDisabled }}\" style=\"padding:12px 20px; border:0; border-radius:9px; background:{{ submitBtnBg }}; color:{{ submitBtnFg }}; font-size:14px; font-weight:600; cursor:{{ submitCursor }}\">Send to the Codex<\u002Fbutton>\n          <span style=\"font-size:12.5px; color:{{ pushFg }}\">{{ pushMsg }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- AUTHORS TAB -->\n    <sc-if value=\"{{ onTabAuthors }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; gap:18px\">\n        <sc-if value=\"{{ hasUncurated }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px 18px; border:1px solid #FCCB20; background:#FFFDF5; border-radius:10px; display:flex; gap:14px; align-items:center; flex-wrap:wrap\">\n            <div style=\"flex:1; min-width:240px\">\n              <div style=\"font-size:13.5px; font-weight:700; margin-bottom:3px\">{{ uncuratedCount }} uncurated in the data<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#5C6B65; line-height:1.5\">These author keys appear in tips.json with no record here — their tips render with the gray fallback.<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ uncurated }}\" as=\"u\" hint-placeholder-count=\"1\">\n              <button sc-camel-on-click=\"{{ u.create }}\" style=\"padding:7px 13px; border:1px solid #DFE5E2; r:{{ pushFg }}\">{{ pushMsg }}<\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ detailGoAuthor }}\" style=\"padding:8px 14px; border:1px solid #DFE5E2; background:#FFFFFF; border-radius:8px; font-size:12.5px; font-weight:600; color:#1A1A1A; cursor:pointer\" style-hover=\"border-color:#009E6D\">More from {{ detailAuthorName }} →<\u002Fbutton>\n          <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ═══════════ SUBMIT MODAL ═══════════ -->\n  <sc-if value=\"{{ submitOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeSubmit }}\" style=\"position:fixed; inset:0; z-index:90; background:rgba(16,28,22,.42); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:24px\">\n      <div sc-camel-on-click=\"{{ stop }}\" style=\"width:100%; max-width:470px; background:#FFFFFF; border-radius:16px; overflow:hidden; box-shadow:0 40px 80px -30px rgba(0,0,0,.5); animation:pmxfade .18s ease-out\">\n        <div style=\"height:5px; background:#009E6D\"><\u002Fdiv>\n        <sc-if value=\"{{ submitForm }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:26px 28px 28px; display:flex; flex-direction:column; gap:16px\">\n            <div style=\"display:flex; align-items:flex-start; gap:12px\">\n              <div style=\"flex:1\">\n                <h2 style=\"margin:0 0 5px; font-size:21px; letter-spacing:-.5px; font-weight:700\">Submit a tip<\u002Fh2>\n                <div style=\"font-size:13px; color:#5C6B65; line-height:1.55\">Paste a link to an Excel article or video. Claude reads it, writes the summary, and credits the author.<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ closeSubmit }}\" style=\"width:30px; height:30px; border-radius:8px; border:1px solid #E4E9E6; background:#FFFFFF; font-size:14px; color:#7C8A84; cursor:pointer\">✕<\u002Fbutton>\n            <\u002Fdiv>\n            <input type=\"url\" value=\"{{ submitUrl }}\" sc-camel-on-change=\"{{ onSubmitUrl }}\" placeholder=\"https://…\" style=\"width:100%; padding:11px 13px; border:1px solid #DFE5E2; border-radius:9px; font-size:14px; outline:none\" style-focus=\"border-color:#009E6D\">\n            <textarea value=\"{{ submitNote }}\" sc-camel-on-change=\"{{ onSubmitNote }}\" rows=\"3\" placeholder=\"Optional — why it's worth filing (helps Claude categorize)\" style=\"width:100%; padding:11px 13px; border:1px solid #DFE5E2; border-radius:9px; font-size:13.5px; resize:vertical; outline:none; font-family:inherit\" style-focus=\"border-color:#009E6D\"><\u002Ftextarea>\n            <button sc-camel-on-click=\"{{ doSubmit }}\" disabled=\"{{ submitDisabled }}\" style=\"padding:12px; border:0; border-radius:9px; background:{{ submitBtnBg }}; color:{{ submitBtnFg }}; font-size:14px; font-weight:600; cursor:{{ submitCursor }}\">Send to the Codex<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ submitDone }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:36px 28px 32px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:12px\">\n            <div style=\"width:52px; height:52px; border-radius:50%; background:#E6F6EF; color:#009E6D; display:flex; align-items:center; justify-content:center; font-size:24px\">✓<\u002Fdiv>\n            <h2 style=\"margin:0; font-size:20px; letter-spacing:-.5px; font-weight:700\">Got it — Claude is reading it.<\u002Fh2>\n            <p style=\"margin:0; font-size:13.5px; line-height:1.6; color:#5C6B65; max-width:330px\">Your tip will appear in the Codex within a few minutes, tagged <span style=\"background:#FCCB20; color:#4A3B00; padding:1px 6px; border-radius:4px; font-weight:700; font-size:11px\">NEW<\u002Fspan> so you can find it.<\u002Fp>\n            <button sc-camel-on-click=\"{{ closeSubmit }}\" style=\"margin-top:
